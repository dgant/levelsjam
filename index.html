<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Levels Jam 2026 prototype: a torchlit labyrinth rendered with three.js."
    />
    <title>MINOTAUR</title>
    <script>
      {
        const isLocalHost = ['127.0.0.1', 'localhost'].includes(window.location.hostname)
        if (!isLocalHost) {
          const analytics = document.createElement('script')
          analytics.async = true
          analytics.defer = true
          analytics.src = 'https://play.dangant.com/daily-dub.js'
          analytics.dataset.websiteId = '9bef1e40-7c7d-463f-919e-b13b6e44d310'
          analytics.dataset.autoTrack = 'false'
          document.head.appendChild(analytics)
        }
        const addHeadPreload = (href, as, rel = 'preload') => {
          const link = document.createElement('link')
          link.rel = rel
          if (as) link.as = as
          if (as === 'fetch' || as === 'image') link.crossOrigin = 'anonymous'
          link.href = href
          document.head.appendChild(link)
        }
        const requestedMazeId = new URLSearchParams(window.location.search).get('maze')

        if (!isLocalHost) {
          addHeadPreload('./assets/app.js', 'script', 'modulepreload')
          addHeadPreload('./assets/bootstrapApp.js', null, 'modulepreload')
          addHeadPreload('./assets/app.css', 'style')
        }
        addHeadPreload('./textures/title.png', 'image')
        addHeadPreload('./textures/subtitle.png', 'image')
        if (requestedMazeId) {
          addHeadPreload(`./maze-data/${requestedMazeId}.json`, 'fetch')
          addHeadPreload(`./maze-data/${requestedMazeId}/probe-assets.json`, 'fetch')
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: #06080c;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgb(33 38 46 / 90%), rgb(6 8 12 / 100%) 60%);
        font-family:
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      .app-shell-bootstrap {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: grid;
        place-content: center;
        gap: 0.175rem;
        background:
          linear-gradient(180deg, rgb(9 11 15 / 88%), rgb(4 6 9 / 94%));
        text-align: center;
      }

      .loading-title-image,
      .loading-subtitle-image {
        display: block;
        height: auto;
        margin: 0 auto;
        user-select: none;
      }

      .loading-title-image {
        width: min(72vw, 720px);
      }

      .loading-subtitle-image {
        width: min(59.5vw, 595px);
        animation: loading-subtitle-breathe 2.4s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes loading-subtitle-breathe {
        0%,
        100% {
          transform: scale(0.985);
        }

        50% {
          transform: scale(1.025);
        }
      }
    </style>
  </head>
  <body>
    <div
      aria-hidden="false"
      class="app-shell app-shell-bootstrap"
      id="bootstrap-loading-shell"
    >
      <div
        aria-hidden="false"
        class="loading-overlay"
        data-loading-complete="false"
      >
        <img
          alt="MINOTAUR"
          class="loading-title-image"
          src="./textures/title.png"
        />
        <img
          alt="Entering the labyrinth"
          class="loading-subtitle-image"
          src="./textures/subtitle.png"
        />
      </div>
    </div>
    <div id="root">
      <div class="app-shell app-shell-bootstrap">
        <div
          aria-hidden="false"
          class="loading-overlay"
          data-loading-complete="false"
        >
          <img
            alt="MINOTAUR"
            class="loading-title-image"
            src="./textures/title.png"
          />
          <img
            alt="Entering the labyrinth"
            class="loading-subtitle-image"
            src="./textures/subtitle.png"
          />
        </div>
      </div>
    </div>
    <script>
      const isLocalHost = ['127.0.0.1', 'localhost'].includes(window.location.hostname)
      const detectViteDevServer = async () => {
        if (!isLocalHost) {
          return false
        }

        try {
          const response = await fetch('/@vite/client', {
            cache: 'no-store'
          })

          return response.ok
        } catch {
          return false
        }
      }
      const preload = (href, as, rel = 'preload') => {
        const link = document.createElement('link')
        link.rel = rel
        if (as) {
          link.as = as
        }
        if (as === 'fetch' || as === 'image') {
          link.crossOrigin = 'anonymous'
        }
        link.href = href
        document.head.appendChild(link)
      }
      const requestedMazeId = new URLSearchParams(window.location.search).get('maze')

      const startApp = async () => {
        const isDevServer = await detectViteDevServer()
        const staticBase = isDevServer ? '/' : './'

        if (!isDevServer) {
          preload('./assets/bootstrapApp.js', null, 'modulepreload')
          preload('./assets/app.css', 'style')
          const stylesheet = document.createElement('link')
          stylesheet.rel = 'stylesheet'
          stylesheet.href = './assets/app.css'
          document.head.appendChild(stylesheet)
        }

        if (requestedMazeId) {
          preload(`${staticBase}maze-data/${requestedMazeId}.json`, 'fetch')
          preload(`${staticBase}maze-data/${requestedMazeId}/probe-assets.json`, 'fetch')
        }

        const script = document.createElement('script')
        script.type = 'module'
        script.src = isDevServer ? '/src/main.tsx' : './assets/app.js'
        document.body.appendChild(script)
      }

      window.requestAnimationFrame(() => {
        void startApp()
      })
    </script>
    <script async src="https://jam.pieter.com/2026/widget.js"></script>
  </body>
</html>
